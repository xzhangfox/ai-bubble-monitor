# (temporary: check the SEC steps on real filings; removed before merging)
name: SEC probe
on:
  push:
    branches: [ml-model]
    paths: [".github/workflows/sec-probe.yml", "ml/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: "AI Bubble Monitor contact@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Coverage
        run: |
          python - <<'PY'
          import time
          from datetime import date
          from ml import common as C, sec_capex as S
          facts = {}
          for t, cik in S.COMPANIES.items():
              facts[t] = S.fetch_facts(cik); time.sleep(0.3)
          for t in S.COMPANIES:
              for what, concepts in [("capex", S.CAPEX_CONCEPTS.get(t, S.DEFAULT_CAPEX)), ("revenue", S.REVENUE_CONCEPTS)]:
                  ttm = S.trailing_year(S.quarters(S.duration_facts(facts[t], concepts)))
                  ends = [p.end for p in ttm]
                  gaps = [f"{a}->{b}" for a, b in zip(ends, ends[1:]) if (b - a).days > 100]
                  used = sorted({c for c in concepts if facts[t]["facts"]["us-gaap"].get(c)})
                  C.annotate("notice", f"{t} {what}", f"{len(ttm)} TTM from {ends[0] if ends else '-'} to {ends[-1] if ends else '-'}; gaps {gaps[:6]}; concepts present {used}")
          out = S.build(facts)
          C.annotate("notice", "aggregate", f"{len(out['series'])} readings from {out['series'][0]['date']} to {out['series'][-1]['date']}")
          PY
