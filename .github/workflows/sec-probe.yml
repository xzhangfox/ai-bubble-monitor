# (temporary: why does SEC refuse the runner? removed before merging)
name: SEC probe
on:
  push:
    branches: [ml-model]
    paths: [".github/workflows/sec-probe.yml", "ml/common.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        run: |
          python - <<'PY'
          import os, urllib.request
          from ml import common as C
          # (diagnosis only: does the contact's domain matter, or is it the runner's address?)
          for label, ua in [("example-domain", "AI Bubble Monitor contact@example.com"), ("person-format", "Jane Doe jane.doe@example.com")]:
              for url in ["https://data.sec.gov/api/xbrl/companyfacts/CIK0000789019.json"]:
                  C.SEC_USER_AGENT = ua
                  try:
                      b = C.http_get(url, retries=1)
                      C.annotate("notice", f"SEC {label}", f"{url[:60]} OK {len(b)} bytes")
                  except Exception as e:
                      C.annotate("warning", f"SEC {label}", f"{url[:60]} {e}")
          PY
