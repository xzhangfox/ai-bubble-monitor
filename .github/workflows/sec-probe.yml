# (temporary: check the SEC steps on real filings; removed before merging)
name: SEC probe
on:
  push:
    branches: [ml-model]
    paths: [".github/workflows/sec-probe.yml", "ml/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: "AI Bubble Monitor contact@example.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Coverage
        run: |
          python - <<'PY'
          import time
          from datetime import date
          from ml import common as C, sec_capex as S
          facts = {}
          for t, cik in S.COMPANIES.items():
              facts[t] = S.fetch_facts(cik); time.sleep(0.3)
          per = {t: S.company_series(facts[t], t) for t in S.COMPANIES}
          ev = sorted(((r["known"], t, r) for t, rows in per.items() for r in rows), key=lambda e: (e[0], e[1]))
          latest, why, years = {}, {}, {}
          for known, t, r in ev:
              if t not in latest or r["periodEnd"] >= latest[t]["periodEnd"]:
                  latest[t] = r
              if len(latest) < 5:
                  why["missing"] = why.get("missing", 0) + 1; continue
              ends = [date.fromisoformat(x["periodEnd"]) for x in latest.values()]
              spread = (max(ends) - min(ends)).days
              if spread > 120:
                  k = "spread " + min(latest, key=lambda x: latest[x]["periodEnd"])
                  why[k] = why.get(k, 0) + 1; continue
              years[known[:4]] = years.get(known[:4], 0) + 1
          first = {t: rows[0]["known"] for t, rows in per.items()}
          lags = {t: sorted({(date.fromisoformat(r["known"]) - date.fromisoformat(r["periodEnd"])).days for r in rows})[-3:] for t, rows in per.items()}
          C.annotate("notice", "aggregate", f"kept by year {years}; skipped {why}; first known {first}; longest lags {lags}")
          PY
