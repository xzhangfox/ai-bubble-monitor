name: Update AI Bubble Monitor Data

on:
  schedule:
    # 11:15 UTC, Tue-Sat — after the US market close plus Yahoo Finance's
    # end-of-day settle, covering each Mon-Fri session.
    - cron: "15 11 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ai-bubble-data-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt

      # Each Python step below may fail without stopping the day's update:
      # the files it would have written keep their last good version.
      - name: Hyperscaler capex from SEC filings
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m ml.sec_capex

      - name: Fetch data and compute indicators
        run: node scripts/fetch-ai-bubble-data.mjs

      - name: Drawdown model (walk-forward backtest)
        continue-on-error: true
        run: python -m ml.model

      - name: Commitments in the filings (LLM)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m ml.filings_llm

      - name: Daily briefing (LLM)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ml.briefing

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai-bubble
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: update AI bubble monitor data"
          git push origin HEAD:${{ github.ref_name }}
          # Vercel's GitHub integration deploys on its own push webhook,
          # independent of Actions — no extra deploy-trigger step needed here
          # (unlike GitHub Pages, which ignores GITHUB_TOKEN-authored pushes).
